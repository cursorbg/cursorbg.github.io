<div class="translit">
  <label for="translit-in">Имена на кирилица (по едно на ред):</label>
  <textarea id="translit-in" rows="3" placeholder="Мария Георгиева Щерева"></textarea>
  <label class="translit-check"><input type="checkbox" id="translit-upper"> Само главни букви (както в паспорта)</label>
  <label for="translit-out">Транслитерация:</label>
  <textarea id="translit-out" rows="3" readonly></textarea>
  <button type="button" id="translit-copy">Копирай</button>
</div>

<style>
.translit {
  display: flex;
  flex-direction: column;
  gap: .5rem;
  margin: 1.5rem 0;
  padding: 1rem;
  border: 1px solid var(--secondary-color-dark);
  border-radius: var(--radius);
}
.translit textarea {
  width: 100%;
  box-sizing: border-box;
  padding: .5rem;
  font: inherit;
  font-size: 1.1rem;
  color: var(--primary-color);
  background: var(--secondary-color);
  border: 1px solid var(--secondary-color-dark);
  border-radius: var(--radius);
  resize: vertical;
}
.translit textarea:focus { outline: 2px solid var(--tertiary-color); }
.translit .translit-check { display: flex; align-items: center; gap: .4rem; cursor: pointer; }
.translit button {
  align-self: flex-start;
  padding: .4rem 1rem;
  font: inherit;
  color: var(--black);
  background: var(--tertiary-color);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
}
</style>

<script>
(function () {
  // Закон за транслитерацията (ДВ, бр. 19 от 2009 г.)
  var map = {
    'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ж':'zh','з':'z','и':'i','й':'y',
    'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u',
    'ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sht','ъ':'a','ь':'y','ю':'yu','я':'ya'
  };

  function word(w) {
    var allUpper = w.length > 1 && w === w.toUpperCase();
    var out = '';
    for (var i = 0; i < w.length; i++) {
      var ch = w[i], low = ch.toLowerCase();
      var lat = map[low];
      if (lat === undefined) { out += ch; continue; }
      // „ия“ в края на думата се предава чрез „ia“
      if (low === 'я' && i === w.length - 1 && i > 0 && w[i - 1].toLowerCase() === 'и') lat = 'a';
      if (ch !== low) lat = allUpper ? lat.toUpperCase() : lat[0].toUpperCase() + lat.slice(1);
      out += lat;
    }
    return out;
  }

  var input = document.getElementById('translit-in');
  var output = document.getElementById('translit-out');
  var upper = document.getElementById('translit-upper');
  var copy = document.getElementById('translit-copy');

  function update() {
    var res = input.value.replace(/[Ѐ-ӿ]+/g, word);
    output.value = upper.checked ? res.toUpperCase() : res;
  }

  input.addEventListener('input', update);
  upper.addEventListener('change', update);
  copy.addEventListener('click', function () {
    navigator.clipboard.writeText(output.value).then(function () {
      copy.textContent = 'Копирано!';
      setTimeout(function () { copy.textContent = 'Копирай'; }, 1500);
    });
  });
})();
</script>
