
backend:
  name: github
  repo: cursorbg/cursorbg.github.io
  branch: main
  base_url: https://cursor-cms-auth.tridentsdomains.workers.dev
  auth_endpoint: auth

locale: bg

site_url: https://cursor-bg-preview.pages.dev
display_url: https://cursor.bg
show_preview_links: true

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Статии"
    label_singular: "Статия"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    preview_path: "posts/{{slug}}/"
    format: "toml-frontmatter"
    extension: "md"

    media_folder: ""
    public_folder: ""

    fields:
      - label: "Заглавие"
        name: "title"
        widget: "string"

      - label: "Дата"
        name: "date"
        widget: "datetime"

      - label: "Автор"
        name: "author"
        widget: "select"
        options:
          - "4s"
          - "[cc]"
        default: "4s"
        required: true

      - label: "Чернова"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Описание"
        name: "description"
        widget: "text"
        required: false

      - label: "Тагове"
        name: "tags"
        widget: "list"
        required: false

      - label: "Основна снимка"
        name: "coverImg"
        widget: "image"
        required: false

      - label: "Съдържание"
        name: "body"
        widget: "markdown"
