
<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Cursor BG - Editor</title>

  <style>
    /* Floating CMS shortcuts */
    #cms-shortcuts {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: calc(100vw - 40px);
    }

    #cms-shortcuts a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #263238;
      color: white;
      font: 500 13px Arial, sans-serif;
      text-decoration: none;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    }

    #cms-shortcuts a:hover {
      background: #394b55;
    }

    #cms-shortcuts .preview-link {
      background: #008f87;
    }

    #cms-shortcuts .preview-link:hover {
      background: #00766f;
    }

    @media (max-width: 600px) {
      #cms-shortcuts {
        bottom: 10px;
        right: 10px;
      }

      #cms-shortcuts a {
        padding: 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <nav id="cms-shortcuts" aria-label="Editor shortcuts">
    <a
      href="https://github.com/cursorbg/cursorbg.github.io/actions"
      target="_blank"
      rel="noopener noreferrer">
      GitHub Actions ↗
    </a>

    <a
      class="preview-link"
      href="https://cursor-bg-preview.pages.dev/"
      target="_blank"
      rel="noopener noreferrer">
      👁 Private Preview
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>

</body>
</html>
